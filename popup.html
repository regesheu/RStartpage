<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RStartpage Proxy</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="popup-brand"><img src="icons/icon32.png" width="28" height="28" alt=""><div><strong>RStartpage</strong><span id="proxyLabel">Proxy</span></div></div>
      <label class="switch" aria-label="Proxy toggle"><input id="masterToggle" type="checkbox"><span></span></label>
    </header>

    <section id="statusCard" class="status-card off">
      <div class="status-dot"></div>
      <div class="status-copy"><strong id="statusTitle">Proxy is off</strong><span id="statusDetail"></span></div>
      <span id="statusBadge" class="status-badge">OFF</span>
    </section>

    <div id="profileList" class="profile-list"></div>

    <section class="session-quick-section">
      <div class="session-quick-head"><div><strong id="sessionsLabel">Sessions</strong><span id="sessionsHint">Save or restore a browser session</span></div><button id="saveSessionQuickButton" class="session-save-button" type="button">＋ Save</button></div>
      <div id="sessionQuickNotice" class="session-quick-notice" hidden></div>
      <div id="sessionQuickList" class="session-quick-list"></div>
      <button id="manageSessionsButton" class="session-manage-button popup-nav-button" type="button"><span id="manageSessionsLabel">Manage sessions</span><span>›</span></button>
    </section>

    <footer class="popup-footer">
      <button id="manageButton" class="manage-button popup-nav-button" type="button"><span id="manageLabel">Manage proxies</span><span>›</span></button>
      <p id="toolbarHint"></p>
      <div class="popup-credit"><span>made by g.khudiakov for self and others</span><span>contact: <a href="mailto:me@regesh.ru">me@regesh.ru</a></span></div>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="tools-shared.js"></script>
  <script src="proxy-shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
