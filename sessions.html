<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sessions — RStartpage</title>
  <link rel="icon" data-app-favicon href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tools.css">
</head>
<body class="tools-body">
  <div class="page-background" aria-hidden="true"></div>
  <header class="app-navigation-shell"><div id="appNavigation"></div></header>

  <main class="tools-page">
    <section class="tools-hero">
      <div class="eyebrow" data-product-name>RStartpage</div>
      <h1 id="sessionsTitle">Sessions</h1>
      <p id="sessionsIntro">Save the current window and reopen it later.</p>
    </section>

    <div id="sessionsNotice" class="tools-notice" hidden></div>

    <section class="tool-card sessions-page-card">
      <div class="tool-card-head">
        <div><h2 id="managerTitle">Session Manager</h2><p id="managerText">Each saved session keeps its tab order and pinned state.</p></div>
        <button id="saveSessionButton" class="button primary" type="button" disabled data-js-action>＋ Save current window</button>
      </div>
      <div id="sessionsList" class="sessions-list"></div>
      <div id="sessionsEmpty" class="tool-empty" hidden><strong id="sessionsEmptyTitle">No saved sessions</strong><span id="sessionsEmptyText">Save your current tabs as a session.</span></div>
    </section>
  </main>

  <dialog id="sessionDialog" class="dialog session-dialog">
    <form id="sessionForm" method="dialog" novalidate>
      <div class="dialog-header"><div><div class="eyebrow" data-product-name>RStartpage</div><h2 id="sessionDialogTitle">Save session</h2></div><button id="sessionDialogClose" class="icon-button small" type="button" disabled data-js-action aria-label="Close">×</button></div>
      <label class="field"><span id="sessionNameLabel">Session name</span><input id="sessionNameInput" class="input" maxlength="100" placeholder="Work" required></label>
      <div id="sessionFormError" class="form-error" role="alert"></div>
      <div class="dialog-actions"><button id="sessionCancelButton" class="button" type="button" disabled data-js-action>Cancel</button><button id="sessionSaveButton" class="button primary" type="submit">Save</button></div>
    </form>
  </dialog>

  <script src="shared.js"></script>
  <script src="tools-shared.js"></script>
  <script src="sessions.js"></script>
</body>
</html>
