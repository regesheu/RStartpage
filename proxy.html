<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Proxy — RStartpage</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="proxy.css">
</head>
<body class="proxy-body">
  <div class="page-background" aria-hidden="true"></div>
  <header class="proxy-topbar">
    <div class="proxy-topbar-inner">
      <button id="backButton" class="button" type="button">← RStartpage</button>
      <div class="brand static-brand"><img src="icons/icon32.png" width="28" height="28" alt=""><span>RStartpage</span></div>
      <label class="master-switch"><span id="masterSwitchLabel">Proxy</span><input id="masterToggle" type="checkbox"><i></i></label>
    </div>
  </header>

  <main class="proxy-page">
    <section class="proxy-hero">
      <div>
        <div class="eyebrow">RStartpage</div>
        <h1 id="pageTitle">Proxy profiles</h1>
        <p id="pageIntro"></p>
      </div>
      <div id="heroStatus" class="hero-status off"><span class="hero-dot"></span><div><strong id="heroStatusTitle">Proxy is off</strong><small id="heroStatusDetail"></small></div><b id="heroStatusBadge">OFF</b></div>
    </section>

    <section class="proxy-toolbar">
      <div class="toolbar-left">
        <button id="addProxyButton" class="button primary" type="button">＋ Add proxy</button>
        <button id="testAllButton" class="button" type="button">Test all</button>
      </div>
      <label class="sort-control"><span id="sortLabel">Order</span><select id="sortSelect" class="select"><option value="custom">Custom order</option><option value="name">Sort by name</option><option value="latency">Sort by latency</option></select></label>
    </section>

    <div id="pageNotice" class="proxy-notice" hidden></div>
    <div id="proxyList" class="proxy-list"></div>
    <div id="emptyState" class="proxy-empty" hidden><div class="empty-icon">↗</div><h2 id="emptyTitle">No proxies yet</h2><p id="emptyText">Add your first proxy.</p><button id="emptyAddButton" class="button primary" type="button">＋ Add proxy</button></div>

    <section class="smart-rules-card">
      <div class="smart-rules-head">
        <div><h2 id="smartRulesTitle">Smart Proxy Rules</h2><p id="smartRulesText"></p></div>
        <div class="smart-rules-actions"><label class="master-switch smart-switch"><span id="smartToggleLabel">Smart Routing</span><input id="smartToggle" type="checkbox"><i></i></label><button id="addRuleButton" class="button" type="button">＋ Add rule</button></div>
      </div>
      <p id="smartFallbackText" class="smart-fallback"></p>
      <div id="ruleList" class="rule-list"></div>
      <div id="ruleEmpty" class="rule-empty" hidden></div>
    </section>

    <section class="proxy-footnote">
      <p id="syncNote"></p>
      <p id="testNote"></p>
      <p id="limitNote"></p>
    </section>
    <footer class="app-author-footer page-author-footer">
      <span>made by g.khudiakov for self and others</span>
      <span>contact: <a href="mailto:me@regesh.ru">me@regesh.ru</a></span>
    </footer>
  </main>

  <dialog id="editorDialog" class="dialog proxy-editor-dialog">
    <form id="editorForm" method="dialog">
      <div class="dialog-header"><div><div class="eyebrow">RStartpage Proxy</div><h2 id="editorTitle">Add proxy</h2></div><button id="editorClose" class="icon-button small" type="button">×</button></div>
      <div class="proxy-form-grid">
        <label class="field span-2"><span id="nameLabel">Name</span><input id="nameInput" class="input" maxlength="80" required></label>
        <label class="field"><span id="badgeLabel">Badge</span><input id="badgeInput" class="input" maxlength="2" placeholder="DE"></label>
        <label class="field"><span id="typeLabel">Type</span><select id="schemeSelect" class="select"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks5">SOCKS5</option><option value="socks4">SOCKS4</option></select></label>
        <label class="field"><span id="hostLabel">Host / IP</span><input id="hostInput" class="input" maxlength="255" placeholder="proxy.example.com" required></label>
        <label class="field"><span id="portLabel">Port</span><input id="portInput" class="input" type="number" min="1" max="65535" required></label>
        <div id="authPanel" class="auth-panel span-2">
          <div class="auth-heading"><div><strong id="authTitle">Authentication</strong><small id="localPasswordNote"></small></div><span id="authModeLabel">Optional</span></div>
          <div class="auth-fields">
            <label class="field"><span id="usernameLabel">Username</span><input id="usernameInput" class="input" autocomplete="off"></label>
            <label class="field"><span id="passwordLabel">Password</span><input id="passwordInput" class="input" type="password" autocomplete="new-password"></label>
          </div>
          <label class="checkbox-setting"><input id="syncPasswordInput" type="checkbox"><span id="syncPasswordLabel">Sync password between devices</span></label>
          <p id="syncWarning" class="auth-warning"></p>
          <p id="socksAuthWarning" class="auth-warning" hidden></p>
        </div>
        <label class="field span-2"><span id="bypassLabel">Bypass list</span><textarea id="bypassInput" class="input bypass-textarea" rows="6" placeholder="*.regesh.ru&#10;10.0.0.0/8&#10;<local>"></textarea><small id="bypassHint"></small></label>
        <p id="badgeHelp" class="form-hint span-2"></p>
      </div>
      <div id="editorError" class="form-error"></div>
      <div class="dialog-actions"><button id="cancelButton" class="button" type="button">Cancel</button><button id="saveButton" class="button primary" type="submit">Save</button></div>
    </form>
  </dialog>

  <dialog id="ruleDialog" class="dialog rule-editor-dialog">
    <form id="ruleForm" method="dialog">
      <div class="dialog-header"><div><div class="eyebrow">RStartpage Proxy</div><h2 id="ruleEditorTitle">Add rule</h2></div><button id="ruleEditorClose" class="icon-button small" type="button">×</button></div>
      <div class="proxy-form-grid">
        <label class="field span-2"><span id="ruleNameLabel">Rule name</span><input id="ruleNameInput" class="input" maxlength="100" placeholder="Internal sites"></label>
        <label class="field span-2"><span id="rulePatternLabel">Domain / IP / URL mask</span><input id="rulePatternInput" class="input" maxlength="500" placeholder="*.regesh.ru" required><small id="rulePatternHint"></small></label>
        <label class="field span-2"><span id="ruleRouteLabel">Route through</span><select id="ruleTargetSelect" class="select"></select></label>
        <label class="checkbox-setting span-2"><input id="ruleEnabledInput" type="checkbox" checked><span id="ruleEnabledLabel">Enabled</span></label>
      </div>
      <div id="ruleEditorError" class="form-error"></div>
      <div class="dialog-actions"><button id="ruleCancelButton" class="button" type="button">Cancel</button><button id="ruleSaveButton" class="button primary" type="submit">Save</button></div>
    </form>
  </dialog>

  <script src="shared.js"></script>
  <script src="proxy-shared.js"></script>
  <script src="proxy.js"></script>
</body>
</html>
