name: Diagnose Proxy Routing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-proxy.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore extension source
        run: bash scripts/bootstrap-source.sh
      - name: Print PAC generator only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in sorted(Path('.').glob('*.js')):
              s = p.read_text(encoding='utf-8')
              for needle in ['FindProxyForURL', 'buildPac', 'pac_script', 'pacScript']:
                  idx = s.lower().find(needle.lower())
                  if idx >= 0:
                      print(f'FILE={p} NEEDLE={needle} OFFSET={idx}')
                      print(s[max(0, idx-5000):min(len(s), idx+12000)])
                      print('END_EXCERPT')
          PY
