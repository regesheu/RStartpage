name: Diagnose Proxy Routing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-proxy.yml'
      - 'source-bundle/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore extension source
        run: bash scripts/bootstrap-source.sh
      - name: Print proxy source context
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ['FindProxyForURL', 'pacScript', 'buildPac', 'bypass', 'smartRouting', 'smartRules']
          for p in sorted(Path('.').glob('*.js')):
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              hits = [n for n in needles if n.lower() in s.lower()]
              if not hits:
                  continue
              print(f'######## FILE {p} hits={hits} ########')
              for needle in needles:
                  start = 0
                  count = 0
                  while True:
                      i = s.lower().find(needle.lower(), start)
                      if i < 0 or count >= 8:
                          break
                      a = max(0, i - 2200)
                      b = min(len(s), i + 4200)
                      print(f'===== {needle} offset {i} =====')
                      print(s[a:b])
                      print()
                      start = i + len(needle)
                      count += 1
          PY
