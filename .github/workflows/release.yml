name: Build and publish extension

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore extension source
        run: bash scripts/bootstrap-source.sh

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import json
          print(json.load(open('manifest.json', encoding='utf-8'))['version'])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Tag version $TAG_VERSION does not match manifest version $VERSION" >&2
              exit 1
            fi
          fi

      - name: Build extension ZIP
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
        run: bash scripts/build.sh

      - name: Build Firefox ZIP
        env:
          FIREFOX_DRIVE_CLIENT_ID: ${{ secrets.FIREFOX_DRIVE_CLIENT_ID }}
        run: |
          bash scripts/build.sh firefox
          node scripts/test-firefox.mjs

      - name: Verify release credentials
        env:
          DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          for name in DRIVE_CLIENT_ID CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Create stable latest asset
        shell: bash
        run: |
          cp "dist/RStartpage-${{ steps.version.outputs.version }}.zip" "dist/RStartpage-latest.zip"
          cp "dist/RStartpage-Firefox-${{ steps.version.outputs.version }}.zip" "dist/RStartpage-Firefox-latest.zip"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version ${VERSION} already has a release; increment manifest.json before publishing" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "dist/RStartpage-${VERSION}.zip" \
            "dist/RStartpage-latest.zip" \
            "dist/RStartpage-Firefox-${VERSION}.zip" \
            "dist/RStartpage-Firefox-latest.zip" \
            --target "$GITHUB_SHA" \
            --title "RStartpage ${VERSION}" \
            --generate-notes

      - name: Upload and submit Chrome Web Store update
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ZIP: dist/RStartpage-${{ steps.version.outputs.version }}.zip
        run: python3 scripts/publish-store.py
