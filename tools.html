<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Tools — RStartpage</title>
  <link rel="icon" data-app-favicon href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tools.css">
  <link rel="stylesheet" href="glass.css"><link rel="stylesheet" href="refinement.css">
</head>
<body class="tools-body">
  <div class="page-background" aria-hidden="true"></div>
  <header class="app-navigation-shell"><div id="appNavigation"></div></header>

  <main class="tools-page">
    <section class="tools-hero">
      <div class="eyebrow" data-product-name>RStartpage</div>
      <h1 id="toolsTitle">Tools</h1>
      <p id="toolsIntro">Find duplicate bookmarks and diagnose unavailable links.</p>
    </section>

    <div id="toolsNotice" class="tools-notice" hidden></div>

    <section id="duplicatesSection" class="tool-card">
      <div class="tool-card-head">
        <div><h2 id="duplicatesTitle">Duplicate Finder</h2><p id="duplicatesText">Find bookmarks that point to the same URL.</p></div>
        <div class="tool-actions-inline">
          <select id="duplicateScope" class="select" aria-label="Duplicate search scope"><option value="rstartpage">RStartpage</option><option value="all">All Chrome bookmarks</option></select>
          <button id="findDuplicatesButton" class="button primary" type="button" disabled data-js-action>Find duplicates</button>
          <button id="checkAllDuplicatesButton" class="button" type="button" disabled data-js-action hidden>Check all</button>
        </div>
      </div>
      <div id="duplicateProgress" class="progress-block" hidden><div class="progress-track"><i id="duplicateProgressBar"></i></div><span id="duplicateProgressText"></span></div>
      <div id="duplicateSummary" class="tool-summary" hidden></div>
      <div id="duplicateResults" class="diagnostic-list"></div>
    </section>

    <section id="linksSection" class="tool-card">
      <div class="tool-card-head">
        <div><h2 id="linksTitle">Link Checker</h2><p id="linksText">Check bookmarks for HTTP errors, timeouts and unreachable sites. Nothing is deleted automatically.</p></div>
        <div class="tool-actions-inline"><select id="linkScope" class="select" aria-label="Link check scope"><option value="rstartpage">RStartpage</option><option value="all">All Chrome bookmarks</option></select><button id="checkLinksButton" class="button primary" type="button" disabled data-js-action>Check links</button></div>
      </div>
      <div id="linkProgress" class="progress-block" hidden><div class="progress-track"><i id="linkProgressBar"></i></div><span id="linkProgressText"></span></div>
      <div id="linkSummary" class="tool-summary" hidden></div>
      <div id="linkResults" class="diagnostic-list"></div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="tools-shared.js"></script>
  <script src="tools.js"></script>
</body>
</html>
