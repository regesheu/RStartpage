<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>RStartpage</title>
  <link rel="icon" data-app-favicon href="icons/icon32.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="glass.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-navigation-shell"><div id="appNavigation"></div></header>
    <div class="topbar home-toolbar">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"></path></svg>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="Search RStartpage" aria-label="Search bookmarks" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.aria">
        <button id="searchClearButton" class="search-clear-button" type="button" aria-label="Clear search" disabled data-js-action hidden>×</button>
        <kbd id="searchShortcut" class="shortcut-chip">Ctrl K</kbd>
      </div>

      <div class="top-actions">
        <div class="menu-host">
          <button id="addButton" class="button primary" type="button" disabled data-js-action aria-haspopup="menu" aria-expanded="false">
            <span class="button-icon">＋</span><span class="button-label" data-i18n="add.label">Add</span>
          </button>
          <div id="addMenu" class="menu" role="menu" hidden>
            <button type="button" disabled data-js-action role="menuitem" data-add="bookmark"><span data-i18n="add.link">Link</span><kbd>⇧ A</kbd></button>
            <button type="button" disabled data-js-action role="menuitem" data-add="group"><span data-i18n="add.group">Group</span></button>
            <button type="button" disabled data-js-action role="menuitem" data-add="workspace"><span data-i18n="add.section">Section</span></button>
          </div>
        </div>
        <button id="helpButton" class="icon-button" type="button" disabled data-js-action title="Keyboard shortcuts" aria-label="Keyboard shortcuts" data-i18n-title="help.shortcuts" data-i18n-aria-label="help.shortcuts">?</button>
      </div>
    </div>

    <nav id="workspaceTabs" class="workspace-tabs" aria-label="Sections" data-i18n-aria-label="sections.aria"></nav>
    <main id="content" class="content" aria-live="polite"><div class="loading" data-i18n="loading">Loading…</div></main>
  </div>

  <div id="contextMenu" class="context-menu" role="menu" hidden></div>

  <dialog id="editorDialog" class="dialog">
    <form id="editorForm" method="dialog" novalidate>
      <div class="dialog-header">
        <div><div id="editorEyebrow" class="eyebrow"></div><h2 id="editorTitle">Add</h2></div>
        <button class="icon-button small" type="button" disabled data-js-action data-close-dialog aria-label="Close" data-i18n-aria-label="common.close">×</button>
      </div>
      <div id="editorFields" class="dialog-fields"></div>
      <div id="editorError" class="form-error" role="alert"></div>
      <div class="dialog-actions"><button class="button" type="button" disabled data-js-action data-close-dialog data-i18n="common.cancel">Cancel</button><button id="editorSubmit" class="button primary" type="submit" data-i18n="common.save">Save</button></div>
    </form>
  </dialog>

  <dialog id="shortcutsDialog" class="dialog shortcuts-dialog">
    <form method="dialog" novalidate>
      <div class="dialog-header"><div><div class="eyebrow" data-i18n="shortcuts.eyebrow">Navigation</div><h2 data-i18n="shortcuts.heading">Keyboard shortcuts</h2></div><button class="icon-button small" type="button" disabled data-js-action data-close-shortcuts aria-label="Close" data-i18n-aria-label="common.close">×</button></div>
      <div class="shortcut-list">
        <div><span data-i18n="shortcuts.search">Search</span><kbd>Ctrl/⌘ K</kbd></div>
        <div><span data-i18n="shortcuts.addLink">Add link</span><kbd>Shift A</kbd></div>
        <div><span data-i18n="shortcuts.switchSection">Switch section</span><kbd>Alt 1…9</kbd></div>
        <div><span data-i18n="shortcuts.showHelp">Show this help</span><kbd>?</kbd></div>
        <div><span data-i18n="shortcuts.close">Close menu/dialog</span><kbd>Esc</kbd></div>
      </div>
      <div class="dialog-actions"><button class="button primary" type="button" disabled data-js-action data-close-shortcuts data-i18n="common.done">Done</button></div>
    </form>
  </dialog>

  <script src="shared.js"></script>
  <script src="tools-shared.js"></script>
  <script src="proxy-shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
